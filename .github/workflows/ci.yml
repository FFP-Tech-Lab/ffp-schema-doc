name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lc_all:
          - C.UTF-8
          - en_US.UTF-8
    env:
      LC_ALL: ${{ matrix.lc_all }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure locales
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen en_US.UTF-8
          locale -a
          locale

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Record Node and ICU
        run: |
          set -euo pipefail
          echo "LC_ALL=${LC_ALL}"
          locale
          node -p "process.version"
          node -p "process.versions.icu"
          node -p "JSON.stringify({ node: process.version, icu: process.versions.icu, lcAll: process.env.LC_ALL })"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Diff function bodies
        run: pnpm diff-bodies

      - name: Build
        run: pnpm build

      - name: Load CJS build
        run: node -e "const m = require('./dist/index.js'); if (typeof m.buildDdl !== 'function' || typeof m.buildPostgresSchemaDoc !== 'function' || typeof m.parseSchemaDoc !== 'function') { console.error(Object.keys(m)); process.exit(1); }"
