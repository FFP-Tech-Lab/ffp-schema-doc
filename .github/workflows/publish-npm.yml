name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require a stable tag reachable from main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing ${tag}: only vX.Y.Z is published. Prereleases are not routed to --tag next."
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Require the tag to equal v plus package.json version
        run: node scripts/check-publish-tag.mjs "$GITHUB_REF_NAME"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          set -euo pipefail
          echo "LC_ALL=${LC_ALL}"
          locale
          pnpm test

      - name: Diff function bodies
        run: pnpm diff-bodies

      - name: Prove body-diff mutations fail
        run: pnpm diff-bodies:prove

      - name: Reject extracted-project names
        run: pnpm check-standalone

      - name: Build
        run: pnpm build

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require CI and integration success for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          ci_runs="$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --json conclusion,status,headSha,url --limit 50)"
          integration_runs="$(gh run list --commit "$GITHUB_SHA" --workflow integration.yml --json conclusion,status,headSha,url --limit 50)"
          echo "ci.yml"
          echo "$ci_runs"
          echo "integration.yml"
          echo "$integration_runs"
          node --input-type=module -e '
            const workflows = [
              ["ci.yml", JSON.parse(process.argv[1])],
              ["integration.yml", JSON.parse(process.argv[2])],
            ];
            let failed = false;
            for (const [name, runs] of workflows) {
              const forSha = runs.filter((run) => run.headSha === process.env.GITHUB_SHA);
              if (forSha.some((run) => run.conclusion === "success")) {
                console.log(name + " succeeded for " + process.env.GITHUB_SHA);
                continue;
              }
              failed = true;
              if (forSha.length === 0) {
                console.error(name + " has no run for " + process.env.GITHUB_SHA);
                continue;
              }
              const conclusions = forSha
                .map((run) => run.conclusion || run.status || "unknown")
                .join(", ");
              console.error(
                name + " has no successful run for " + process.env.GITHUB_SHA + " (conclusions: " + conclusions + ")",
              );
            }
            if (failed) process.exit(1);
          ' "$ci_runs" "$integration_runs"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Require the tag to equal v plus package.json version
        run: node scripts/check-publish-tag.mjs "$GITHUB_REF_NAME"

      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      - name: Install and build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Load CJS build
        run: node -e "const m = require('./dist/index.js'); if (typeof m.buildDdl !== 'function' || typeof m.buildPostgresSchemaDoc !== 'function' || typeof m.parseSchemaDoc !== 'function' || typeof m.buildMysqlSchemaDoc !== 'function') { console.error(Object.keys(m)); process.exit(1); }"

      - name: Compare this version if it is already published
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          set +e
          npm view "ffp-schema-doc@${version}" version >view.out 2>view.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qiE 'E404|404 Not Found' view.err; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "ffp-schema-doc@${version} is not published"
              exit 0
            fi
            echo "npm view failed for a reason other than a missing version" >&2
            cat view.err >&2
            exit 1
          fi
          remote_head="$(npm view "ffp-schema-doc@${version}" gitHead)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "published ffp-schema-doc@${version} gitHead does not match this commit" >&2
            echo "gitHead remote=${remote_head} local=${GITHUB_SHA}" >&2
            exit 1
          fi
          remote_dir="${RUNNER_TEMP}/published-pack"
          local_dir="${RUNNER_TEMP}/local-pack"
          mkdir -p "$remote_dir" "$local_dir"
          npm pack "ffp-schema-doc@${version}" --ignore-scripts --pack-destination "$remote_dir"
          npm pack --ignore-scripts --pack-destination "$local_dir"
          node scripts/check-publish-pack.mjs contents \
            "$remote_dir/ffp-schema-doc-${version}.tgz" \
            "$local_dir/ffp-schema-doc-${version}.tgz"
          echo "ffp-schema-doc@${version} is already published from this commit with the same file contents"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Require the packed file list and version
        if: steps.published.outputs.skip != 'true'
        run: node scripts/check-publish-pack.mjs manifest "${GITHUB_REF_NAME#v}"

      - name: Publish with OIDC trusted publishing
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          echo "publishing with OIDC trusted publishing; NODE_AUTH_TOKEN is unset"
          env -u NODE_AUTH_TOKEN npm publish --provenance --access public --ignore-scripts
