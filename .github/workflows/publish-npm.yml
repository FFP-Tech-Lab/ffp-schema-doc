name: Publish npm

# Tag-gated publish of ffp-schema-doc. Does not run on pull requests.
# Push tag vX.Y.Z matching package.json. Do not publish from a pull request.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${VERSION}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "Git tag '${TAG}' does not match package.json version '${VERSION}' (expected '${EXPECTED}')." >&2
            exit 1
          fi

          set +e
          VIEW_OUT="$(npm view "${NAME}@${VERSION}" version 2>&1)"
          VIEW_STATUS=$?
          set -e
          if [ "${VIEW_STATUS}" -eq 0 ]; then
            echo "Note: ${NAME}@${VERSION} is already on the registry; skipping publish (idempotent, no force republish)."
            {
              echo "## npm publish skipped"
              echo ""
              echo "\`${NAME}@${VERSION}\` is already on the registry."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if ! grep -qiE 'E404|404 Not Found|is not in this registry' <<<"${VIEW_OUT}"; then
            echo "npm view ${NAME}@${VERSION} failed unexpectedly:" >&2
            echo "${VIEW_OUT}" >&2
            exit 1
          fi

          # Trusted publishing (OIDC) first. NODE_AUTH_TOKEN is unset for this
          # attempt so npm does not prefer a token. On failure, retry with
          # NPM_TOKEN the same way ffp-sql-sandbox authenticates.
          if env -u NODE_AUTH_TOKEN npm publish --provenance --access public; then
            echo "Published ${NAME}@${VERSION} via npm trusted publishing (OIDC)"
          else
            echo "Trusted publishing failed; falling back to NPM_TOKEN" >&2
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo "NPM_TOKEN is not set and trusted publishing failed." >&2
              exit 1
            fi
            npm publish --provenance --access public
            echo "Published ${NAME}@${VERSION} via NPM_TOKEN"
          fi
          {
            echo "## npm publish"
            echo ""
            echo "Published \`${NAME}@${VERSION}\` to https://www.npmjs.com/package/${NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
